[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "filegrail"
version = "0.8.2"
description = "Reconstruct where the files in a directory came from, after the fact."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "osint-shifu" }]
keywords = [
  "provenance",
  "metadata",
  "exif",
  "gps",
  "c2pa",
  "content-credentials",
  "osint",
  "dfir",
  "forensics",
  "investigations",
  "downloads",
  "file-origin",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Legal Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "ruff>=0.6,<1", "mypy>=1.11,<2"]

# Kept out of `dev` on purpose. `hypothesis` is the one thing in this repo whose
# result depends on a seed rather than on the code, and the nine test jobs in
# the matrix are there to answer "does this commit work", which is a question
# that has to mean the same thing twice. The fuzzing gets its own job, where a
# red run is a finding rather than a rerun.
fuzz = ["hypothesis>=6,<7"]

[project.urls]
Homepage = "https://github.com/osint-shifu/filegrail"
Repository = "https://github.com/osint-shifu/filegrail"
Issues = "https://github.com/osint-shifu/filegrail/issues"
Changelog = "https://github.com/osint-shifu/filegrail/blob/master/CHANGELOG.md"

[project.scripts]
filegrail = "filegrail.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/filegrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# The annotations were already there; this is what makes them load-bearing.
# Checked against the oldest supported interpreter, so a construct newer than
# the floor is a failure here rather than a surprise for somebody on 3.10.
[tool.mypy]
python_version = "3.10"
files = ["src/filegrail"]

# `strict` rather than the list of flags that used to be here, on the same
# principle: everything under it already passes, and a flag nothing satisfies is
# a comment rather than a check. The list was what could be turned on while
# forty-two annotations were missing; those are written, so the whole of strict
# holds and there is no boundary left to describe.
strict = true
