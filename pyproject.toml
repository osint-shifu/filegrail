[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "filetrail"
version = "0.1.0"
description = "Reconstruct where the files in a directory came from, after the fact."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["osint", "dfir", "provenance", "forensics", "investigations", "downloads"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "ruff>=0.6,<1"]

[project.scripts]
filetrail = "filetrail.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/filetrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
