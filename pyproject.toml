[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "filegrail"
version = "0.1.0"
description = "Reconstruct where the files in a directory came from, after the fact."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "osint-shifu" }]
keywords = [
  "provenance",
  "metadata",
  "exif",
  "gps",
  "c2pa",
  "content-credentials",
  "osint",
  "dfir",
  "forensics",
  "investigations",
  "downloads",
  "file-origin",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Legal Industry",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "ruff>=0.6,<1"]

[project.urls]
Homepage = "https://github.com/osint-shifu/filegrail"
Repository = "https://github.com/osint-shifu/filegrail"
Issues = "https://github.com/osint-shifu/filegrail/issues"
Changelog = "https://github.com/osint-shifu/filegrail/blob/master/CHANGELOG.md"

[project.scripts]
filegrail = "filegrail.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/filegrail"]

# The IANA TLD list is data, not code, and hatchling will not guess that.
[tool.hatch.build.targets.wheel.force-include]
"src/filegrail/data" = "filegrail/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
