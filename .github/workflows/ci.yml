name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest

  types:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Mypy
        run: mypy

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
      - name: What has to be inside the wheel, and what it has to say
        run: |
          python - <<'CHECK'
          import glob, zipfile

          wheel = zipfile.ZipFile(glob.glob("dist/*.whl")[0])
          names = wheel.namelist()

          # Neither of these is imported, so nothing else notices their absence:
          # the TLD list is data the identifier reader needs, and the marker is
          # what makes the annotations visible to anyone installing this.
          for needed in ("filegrail/data/tlds.txt", "filegrail/py.typed"):
              assert needed in names, (needed, names)

          metadata = wheel.read(
              next(n for n in names if n.endswith(".dist-info/METADATA"))
          ).decode()
          assert "License-Expression: Apache-2.0" in metadata, metadata
          assert "License-File: LICENSE" in metadata, metadata
          assert "Classifier: License ::" not in metadata, metadata
          CHECK
      - name: Install what was built and run it
        run: |
          python -m pip install dist/*.whl
          filegrail --version
