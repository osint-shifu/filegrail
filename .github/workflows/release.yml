name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify the release commit
        run: |
          git fetch --depth=1 origin master:refs/remotes/origin/master
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"
          VERSION=$(python -c 'exec(open("src/filegrail/__init__.py").read()); print(__version__)')
          test "v$VERSION" = "$GITHUB_REF_NAME"
      - name: Install verification tools
        run: python -m pip install -e ".[dev]" build twine
      - name: Verify
        run: |
          ruff check .
          ruff format --check .
          pytest
          mypy
          python -m build
          twine check dist/*

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi

    # Trusted Publishing: PyPI verifies this workflow's identity, so there is
    # no API token to store, rotate or leak.
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest

    # The release page carries the changelog's section for this version.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release_notes.py "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "filegrail ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag --latest
